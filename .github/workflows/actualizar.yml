name: Actualizar datos NBA

# Baja las líneas del día y recalcula el semáforo. Corre en la franja de partidos (UTC) y a mano.
on:
  # Cada corrida hace ≈350 consultas a LudoProps (~3 min): pocas corridas por día para no cargar su servidor.
  schedule:
    - cron: "15 16 * * *"          # mediodía ET
    - cron: "45 22 * * *"          # justo después del reporte de lesiones de las 17:00 ET
    - cron: "30 0 * * *"           # 19:30 ET, antes de los partidos del Oeste
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas
        run: python3 -m unittest discover -s tests
      - name: Generar datos
        run: python3 scripts/actualizar.py
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
