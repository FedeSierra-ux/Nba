name: Actualizar datos NBA

# Baja las líneas del día y recalcula el semáforo. Corre en la franja de partidos (UTC) y a mano.
on:
  # Cada corrida hace ≈350 consultas a LudoProps (~3 min): pocas corridas por día para no cargar su servidor.
  schedule:
    - cron: "15 16 * * *"          # mediodía ET
    - cron: "50 21 * * *"          # 16:50 ET (horario de invierno), con el reporte de lesiones de la tarde
    - cron: "20 23 * * *"          # 18:20 ET, antes de los partidos de las 19:00 ET
    # El historial solo guarda partidos que no empezaron, así que una corrida tardía no lo contamina.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pruebas
        # incluye tests/test_modelo.py, tests/test_datos.py y tests/test_resultados.py
        run: |
          python3 -m unittest discover -s tests
          SKIP_DATOS_REALES=1 node --test tests/correlacion.test.js tests/sugeridas.test.js
      - name: Resultados y calibración
        # Califica los días anteriores (≈ 1 consulta a LudoProps por partido) y recalcula docs/data/calibracion.json.
        # Si falla, la actualización del día sigue igual.
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/resultados.py
      - name: Generar datos
        run: python3 scripts/actualizar.py
      - name: Foto de las combinadas sugeridas
        # Guarda las sugeridas pre-partido en el historial del día (solo la primera vez en el día).
        continue-on-error: true
        run: node scripts/foto_sugeridas.js
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%dT%H:%MZ)"
            # si alguien subió cambios durante la corrida, se rebasa y se reintenta
            for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
          fi
